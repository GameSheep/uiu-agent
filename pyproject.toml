[project]
name = "uiu"
version = "0.1.1"
description = "A minimal personal-IP agent: SOUL-driven, skills-extensible, OpenAI-compatible CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "cli", "personal-ip", "soul", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.40.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "pyyaml>=6.0",
    # channel adapters
    "dingtalk-stream>=0.18.0",
    "discord.py>=2.3.0",
    "slack-bolt>=1.18.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB/uiu"
Repository = "https://github.com/YOUR_GITHUB/uiu"
Issues = "https://github.com/YOUR_GITHUB/uiu/issues"

[project.scripts]
uiu = "uiu.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uiu"]

[tool.hatch.build.targets.wheel.force-include]
# 首次 init 用的默认 workspace 模板，随包分发
"workspace/SOUL.md" = "uiu/_default_workspace/SOUL.md"
"workspace/IDENTITY.md" = "uiu/_default_workspace/IDENTITY.md"
"workspace/USER.md" = "uiu/_default_workspace/USER.md"
"workspace/MEMORY.md" = "uiu/_default_workspace/MEMORY.md"
"workspace/skills/echo/SKILL.md" = "uiu/_default_workspace/skills/echo/SKILL.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["uiu*"]