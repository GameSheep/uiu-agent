name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (core + test + all capability extras)
        # 必须装 [all]：测试会 import 桌面（PIL/cv2/numpy/pyautogui/win32gui）与
        # 渠道（cryptography）等可选依赖的模块；只装核心会让 CI 变红。
        # 这条约定由 tests/test_ci_contract.py 守着。
        run: pip install -e ".[test,all]"

      # 先跑契约检查（<1s 失败）：装少 extras 时立刻给出「缺哪个 extra」，
      # 而不是让 60+ 个测试文件在 import 阶段炸出一堆 ModuleNotFoundError。
      # 线上 CI 曾两次红在 "Unit tests"，都属这一类，日志却只显示 "exit code 1"。
      - name: Verify CI extras contract (fast fail)
        run: python -m pytest tests/test_ci_contract.py -q

      - name: Byte-compile all sources
        run: python -m compileall -q src

      - name: Unit tests (no LLM / network)
        run: python -m pytest tests/ -q

      # 覆盖率门禁：只保证不低于已记录基线（见审计 §6.1），随轮次抬高
      - name: Coverage gate (baseline, no regressions)
        run: python -m pytest tests/ -q --cov=uiu --cov-report=term-missing --cov-fail-under=58

      - name: CLI smoke (offline, isolated workspace)
        run: python cli_smoke.py

      - name: Windows install-state acceptance (build wheel -> fresh venv -> smoke)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify_windows_install.ps1
