[project]
name = "uiu"
version = "0.1.7"
description = "A minimal personal-IP agent: SOUL-driven, skills-extensible, OpenAI-compatible CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GameSheep", email = "630920922@qq.com" }]
keywords = ["agent", "cli", "personal-ip", "soul", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 核心依赖 = 「装完立刻能聊天 + 能开 TUI」的最小集合（实测 8 个，全部轻量）。
#
# 判据不是「谁被 import 过」，而是**谁是启动路径上真正必需的**：屏蔽下列每个库以后，
# 24 个核心模块（config/sessions/agent/tools/main/app/gateway/cron/doctor/...）依然全部导入成功
# （见 docs/product-readiness-2026-09-18.md 与 tests/test_packaging_contract.py 的守门断言）。
# 其余能力一律进 extras：桌面自动化 [desktop]、OCR [ocr]、Excel [office]、
# 消息渠道 [channels]、浏览器 [browser]、语音 [voice]、向量记忆 [rag]、MCP [mcp]。
dependencies = [
    # 模型 SDK：基础对话必须有其一；两者都很轻（纯 Python + httpx），放进核心，
    # 免得用户为了「能聊天」还得先研究 extras
    "openai>=1.40.0",
    "anthropic>=0.40.0",
    # 终端 UI：REPL 用 rich/prompt-toolkit，全屏 TUI 用 textual
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "textual>=8.0.0",
    "pyyaml>=6.0",
    # 系统信息（TUI 状态栏）+ 剪贴板（复制回答）
    "psutil>=5.9.0",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
# pip install uiu[channels] — 钉钉/Disord 全量适配
channels = [
    "dingtalk-stream>=0.18.0",
    "discord.py>=2.3.0",
    # 轻量 socket 适配：Slack
    "slack-bolt>=1.18.0",
    # 企业微信官方回调的 AES 解密 / 签名验证
    "cryptography>=42.0.0",
]
# pip install uiu[desktop] — CV 桌面自动化（需大模型 key）+ Windows UIA 控件定位
desktop = [
    "askui>=0.1.0",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
    # 鼠标键盘 / 截图 / 窗口控制
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    # 屏幕图像比对：auto_recovery / icon_locator / screen_diff 直接 import
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
]
# pip install uiu[ocr] — 屏幕文字识别（按名字点按钮）。拖 onnxruntime，装完 200MB 级
ocr = [
    "uiu[desktop]",
    "rapidocr-onnxruntime>=1.2.3",
    "screen-ocr[winrt]>=0.5.0; sys_platform == 'win32'",
]
# pip install uiu[office] — 读写 Excel
office = ["openpyxl>=3.1.0"]
# pip install uiu[browser] — AI 浏览器（拖 playwright+chromium，体积大）
browser = [
    "browser-use>=0.1.0",
    "playwright>=1.40.0",
    # cdp_controller 用 websockets 直连浏览器调试端口
    "websockets>=12.0",
]
# pip install uiu[mcp] — 外部工具协议
mcp = ["mcp>=1.28.0"]
# pip install uiu[voice] — TTS + STT（STT 拖 whisper，模型首次使用时下载）
voice = [
    "edge-tts>=6.1.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "SpeechRecognition>=3.10.0",
    "openai-whisper>=20231117",
    # whisper 音频重采样
    "scipy>=1.11.0",
]
# pip install uiu[rag] — 本地向量记忆（拖 torch ~2GB + 首次下载模型）
rag = ["chromadb>=0.4.0", "sentence-transformers>=2.2.0"]
# pip install uiu[all] — 全部重依赖
all = [
    "uiu[channels]", "uiu[desktop]", "uiu[ocr]", "uiu[office]",
    "uiu[browser]", "uiu[mcp]", "uiu[voice]", "uiu[rag]",
]
# pip install -e ".[test]" — 跑 tests/
# 覆盖率基线见 docs/audit-2026-09-16-product-gap.md §6.1：
# 门禁只保证「不低于已记录的下限」，新增代码请自带测试。
test = [
    "pytest>=8.0.0",
    "coverage>=7.4.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
# 发布前改成你自己的仓库地址
Homepage = "https://github.com/uiu-agent/uiu"
Repository = "https://github.com/uiu-agent/uiu"
Issues = "https://github.com/uiu-agent/uiu/issues"

[project.scripts]
uiu = "uiu.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uiu"]
# _default_workspace / _default_skills 已在 src/uiu 内，随包自动打进 wheel，无需 force-include

[tool.setuptools.packages.find]
where = ["src"]
include = ["uiu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: 需要真实 LLM key 的端到端测试（默认跳过；UIU_E2E_LIVE=1 + 有 key 才跑）",
]
# 覆盖率用显式命令行开启（pytest-cov），默认不拖慢日常跑测：
#   pytest --cov=uiu --cov-report=term-missing --cov-fail-under=30

[tool.coverage.run]
source = ["src/uiu"]
branch = false
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# 这些行不计入分母：平台分支、类型检查、抽象方法、显式 no cover
exclude_also = [
    "if TYPE_CHECKING:",
    "if sys.platform",
    "raise NotImplementedError",
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "except ImportError:",
    "@overload",
]
# 现状基线（2026-09-18 用真 coverage.py 实测 src/uiu 语句覆盖 60.2%，见审计 §6.1）。
# 只保证不回退；新增代码请自带测试，阈值随轮次抬高。
fail_under = 58