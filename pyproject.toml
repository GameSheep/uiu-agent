[project]
name = "my-agent"
version = "0.1.0"
description = "A minimal personal-IP agent skeleton: SOUL-driven, skills-extensible, OpenAI-compatible."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "pyyaml>=6.0",
]

[project.scripts]
my-agent = "myagent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["myagent*"]

[tool.setuptools.package-data]
myagent = ["_default_skills/**/*.md"]